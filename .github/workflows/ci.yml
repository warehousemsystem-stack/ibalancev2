name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: pytest -q

  # La DLL solo carga en Windows de 32 bits; aqui se comprueba al menos que
  # todo el paquete importa y que la CLI arranca en Windows.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x86"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m ibalance --version
