[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibalance-rongta-sync"
version = "1.0.0"
description = "Sincroniza productos (PLU) con balanzas Rongta RLS-1000/1100 a traves de rtslabelscale.dll"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # solo biblioteca estandar: simplifica el empaquetado en 32 bits

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
build = ["pyinstaller>=6.0"]

[project.scripts]
ibalance = "ibalance.cli:main"

[project.gui-scripts]
ibalance-gui = "ibalance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
